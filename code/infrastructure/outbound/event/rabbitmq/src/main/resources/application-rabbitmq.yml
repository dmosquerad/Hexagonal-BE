spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    stream:
      bindings:
        publish-user-created-out-0:
          destination: user.created
        publish-user-updated-out-0:
          destination: user.updated
        publish-user-deleted-out-0:
          destination: user.deleted
      rabbit:
        bindings:
          publish-user-created-out-0:
            producer:
              exchangeType: topic
          publish-user-updated-out-0:
            producer:
              exchangeType: topic
          publish-user-deleted-out-0:
            producer:
              exchangeType: topic
