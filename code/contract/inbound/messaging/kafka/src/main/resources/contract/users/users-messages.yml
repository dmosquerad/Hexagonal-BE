messages:
  UserCreated:
    name: UserCreated
    contentType: application/json
    headers:
      type: object
      additionalProperties: false
      required:
        - X-Event-Type
        - X-Event-Id
        - X-Schema-Version
      properties:
        X-Event-Type:
          type: string
          enum:
            - UserCreate
        X-Event-Id:
          type: string
          format: uuid
        X-Schema-Version:
          type: string
    payload:
      $ref: './schemas/users-schema.yml#/schemas/UserCreated'
  UserUpdated:
    name: UserUpdated
    contentType: application/json
    headers:
      type: object
      additionalProperties: false
      required:
        - X-Event-Type
        - X-Event-Id
        - X-Schema-Version
      properties:
        X-Event-Type:
          type: string
          enum:
            - UserUpdate
        X-Event-Id:
          type: string
          format: uuid
        X-Schema-Version:
          type: string
    payload:
      $ref: './schemas/users-schema.yml#/schemas/UserUpdated'
    bindings:
      kafka:
        key:
          type: string
          format: uuid
          description: User aggregate ID from the message payload.
  UserDeleted:
    name: UserDeleted
    contentType: application/json
    headers:
      type: object
      additionalProperties: false
      required:
        - X-Event-Type
        - X-Event-Id
        - X-Schema-Version
      properties:
        X-Event-Type:
          type: string
          enum:
            - UserDelete
        X-Event-Id:
          type: string
          format: uuid
        X-Schema-Version:
          type: string
    payload:
      $ref: './schemas/users-schema.yml#/schemas/UserDeleted'
    bindings:
      kafka:
        key:
          type: string
          format: uuid
          description: User aggregate ID from the message payload.
