messages:
  UserCreated:
    name: UserCreated
    contentType: application/json
    headers:
      type: object
      additionalProperties: false
      required:
        - X-Event-Type
      properties:
        X-Event-Type:
          type: string
          enum:
            - create
    payload:
      $ref: './schemas/users-schema.yml#/schemas/UserCreated'
  UserUpdated:
    name: UserUpdated
    contentType: application/json
    headers:
      type: object
      additionalProperties: false
      required:
        - X-Event-Type
      properties:
        X-Event-Type:
          type: string
          enum:
            - update
    payload:
      $ref: './schemas/users-schema.yml#/schemas/UserUpdated'
    bindings:
      kafka:
        key:
          type: string
          format: uuid
          description: User aggregate ID from the message payload.
  UserDeleted:
    name: UserDeleted
    contentType: application/json
    headers:
      type: object
      additionalProperties: false
      required:
        - X-Event-Type
      properties:
        X-Event-Type:
          type: string
          enum:
            - delete
    payload:
      $ref: './schemas/users-schema.yml#/schemas/UserDeleted'
    bindings:
      kafka:
        key:
          type: string
          format: uuid
          description: User aggregate ID from the message payload.
