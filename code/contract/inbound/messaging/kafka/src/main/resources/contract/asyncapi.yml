asyncapi: 2.6.0
info:
  title: User Kafka Events
  version: 0.0.1
  description: >-
    User events published to Kafka and consumed by the inbound user handler,
    which uses the consumer group user.handler.
id: urn:com:architecture:hexagonal:inbound:kafka:user-events
defaultContentType: application/json
tags:
  - name: user
servers:
  local:
    url: localhost:9092
    protocol: kafka
    description: Local Kafka broker used by the application configuration.
  docker:
    url: kafka:29092
    protocol: kafka
    description: Kafka broker address for clients on the Docker network.
channels:
  user.created:
    $ref: './users/users-channels.yml#/channels/user.created'
  user.updated:
    $ref: './users/users-channels.yml#/channels/user.updated'
  user.deleted:
    $ref: './users/users-channels.yml#/channels/user.deleted'
components:
  messages:
    UserCreated:
      $ref: './users/users-messages.yml#/messages/UserCreated'
    UserUpdated:
      $ref: './users/users-messages.yml#/messages/UserUpdated'
    UserDeleted:
      $ref: './users/users-messages.yml#/messages/UserDeleted'
  schemas:
    MessageHeader:
      $ref: './users/schemas/message-header.json'
    UserCreatedData:
      $ref: './users/schemas/user-created-data.json'
    UserCreated:
      $ref: './users/schemas/user-created.json'
    UserUpdatedData:
      $ref: './users/schemas/user-updated-data.json'
    UserUpdated:
      $ref: './users/schemas/user-updated.json'
    UserDeletedData:
      $ref: './users/schemas/user-deleted-data.json'
    UserDeleted:
      $ref: './users/schemas/user-deleted.json'
