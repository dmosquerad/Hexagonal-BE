asyncapi: 3.0.0
info:
  title: User Kafka Events
  version: 0.0.1
  description: Kafka events consumed.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  userEvents:
    address: user
    bindings:
      kafka:
        topic: user
        partitions: 3
        replicas: 1
        bindingVersion: '0.4.0'
    messages:
      UserCreated:
        $ref: './users/users-messages.yml#/messages/UserCreated'
      UserUpdated:
        $ref: './users/users-messages.yml#/messages/UserUpdated'
      UserDeleted:
        $ref: './users/users-messages.yml#/messages/UserDeleted'
operations:
  onUserEvents:
    action: receive
    channel:
      $ref: '#/channels/userEvents'
    messages:
      - $ref: '#/channels/userEvents/messages/UserCreated'
      - $ref: '#/channels/userEvents/messages/UserUpdated'
      - $ref: '#/channels/userEvents/messages/UserDeleted'
    summary: User events.
    tags:
      - name: user
components:
  messages:
    UserCreated:
      $ref: './users/users-messages.yml#/messages/UserCreated'
    UserUpdated:
      $ref: './users/users-messages.yml#/messages/UserUpdated'
    UserDeleted:
      $ref: './users/users-messages.yml#/messages/UserDeleted'
  schemas:
    MessageHeader:
      $ref: './users/schemas/users-schema.yml#/schemas/MessageHeader'
