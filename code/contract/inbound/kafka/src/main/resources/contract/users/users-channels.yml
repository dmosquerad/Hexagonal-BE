channels:
  user.created:
    bindings:
      kafka:
        topic: user.created
        partitions: 3
        replicas: 1
        bindingVersion: '0.4.0'
    subscribe:
      operationId: onUserCreated
      summary: User-created event.
      description: The inbound handler dispatches user creation and registers the event in the inbox if command handling fails.
      tags:
        - name: user
      message:
        $ref: './users-messages.yml#/messages/UserCreated'
  user.updated:
    bindings:
      kafka:
        topic: user.updated
        partitions: 3
        replicas: 1
        bindingVersion: '0.4.0'
    subscribe:
      operationId: onUserUpdated
      summary: User-updated event.
      description: The inbound handler dispatches user updates and registers the event in the inbox if command handling fails.
      tags:
        - name: user
      message:
        $ref: './users-messages.yml#/messages/UserUpdated'
  user.deleted:
    bindings:
      kafka:
        topic: user.deleted
        partitions: 3
        replicas: 1
        bindingVersion: '0.4.0'
    subscribe:
      operationId: onUserDeleted
      summary: User-deleted event.
      description: The inbound handler dispatches user deletion and registers the event in the inbox if command handling fails.
      tags:
        - name: user
      message:
        $ref: './users-messages.yml#/messages/UserDeleted'
