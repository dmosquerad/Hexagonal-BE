channels:
  user.created:
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.created
          type: topic
          durable: true
          autoDelete: false
    publish:
      operationId: publishUserCreated
      tags:
        - name: user
      message:
        $ref: './users-messages.yml#/messages/UserCreated'
  user.updated:
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.updated
          type: topic
          durable: true
          autoDelete: false
    publish:
      operationId: publishUserUpdated
      tags:
        - name: user
      message:
        $ref: './users-messages.yml#/messages/UserUpdated'
  user.deleted:
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.deleted
          type: topic
          durable: true
          autoDelete: false
    publish:
      operationId: publishUserDeleted
      tags:
        - name: user
      message:
        $ref: './users-messages.yml#/messages/UserDeleted'