schemas:
  MessageHeader:
    type: object
    additionalProperties: false
    required:
      - messageId
      - messageDate
    properties:
      messageId:
        type: string
        format: uuid
      messageDate:
        type: string
        format: date-time
  UserData:
    title: UserData
    type: object
    additionalProperties: false
    required:
      - userId
      - name
      - email
    properties:
      userId:
        type: string
        format: uuid
      name:
        type: string
      email:
        type: string
        format: email
  UserCreated:
    type: object
    additionalProperties: false
    required:
      - messageHeader
      - data
    properties:
      messageHeader:
        $ref: './users-schema.yml#/schemas/MessageHeader'
      data:
        $ref: './users-schema.yml#/schemas/UserData'
  UserUpdated:
    type: object
    additionalProperties: false
    required:
      - messageHeader
      - data
    properties:
      messageHeader:
        $ref: './users-schema.yml#/schemas/MessageHeader'
      data:
        $ref: './users-schema.yml#/schemas/UserData'
  UserDeleted:
    type: object
    additionalProperties: false
    required:
      - messageHeader
      - data
    properties:
      messageHeader:
        $ref: './users-schema.yml#/schemas/MessageHeader'
      data:
        $ref: './users-schema.yml#/schemas/UserData'