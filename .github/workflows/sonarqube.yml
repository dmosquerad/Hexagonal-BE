# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarQube analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# (this feature is available starting from SonarQube 9.7, Developer Edition and above)

# 1. Make sure you add a valid GitHub configuration to your SonarQube (Administration > DevOps platforms > GitHub)

# 2. Import your project on SonarQube
#     * Add your repository as a new project by clicking "Create project" from your homepage.
#
# 3. Select GitHub Actions as your CI and follow the tutorial
#     * a. Generate a new token and add it to your GitHub repository's secrets using the name SONAR_TOKEN
#          (On SonarQube, click on your avatar on top-right > My account > Security or ask your administrator)
#
#     * b. Copy/paste your SonarQube host URL to your GitHub repository's secrets using the name SONAR_HOST_URL
#
#     * c. Copy/paste the project Key into the args parameter below
#          (You'll find this information in SonarQube by following the tutorial or by clicking on Project Information at the top-right of your project's homepage)

# Feel free to take a look at our documentation (https://docs.sonarqube.org/latest/analysis/github-integration/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/sq/10)

name: SonarQube analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  Analysis:
    environment: workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.2
          cache: maven
          cache-dependency-path: code/pom.xml

      - name: Run tests and generate coverage
        working-directory: code
        run: mvn clean verify

      - name: Set SonarQube analysis paths
        shell: bash
        run: |
          echo "SONAR_SOURCES=$(find code -type d -path '*/src/main/java' -print | sort | paste -sd, -)" >> "$GITHUB_ENV"
          echo "SONAR_TESTS=$(find code -type d -path '*/src/test*/java' -print | sort | paste -sd, -)" >> "$GITHUB_ENV"
          echo "SONAR_JAVA_BINARIES=$(find code -type d -path '*/target/classes' -print | sort | paste -sd, -)" >> "$GITHUB_ENV"
          echo "SONAR_JAVA_TEST_BINARIES=$(find code -type d -path '*/target/test-classes' -print | sort | paste -sd, -)" >> "$GITHUB_ENV"
          echo "SONAR_COVERAGE_REPORTS=$(find code -type f -path '*/target/site/jacoco/jacoco.xml' -print | sort | paste -sd, -)" >> "$GITHUB_ENV"

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on SonarQube, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}   # add the URL of your instance to the secrets of this repo with the name SONAR_HOST_URL (Settings > Secrets > Actions > add new repository secret)
        with:
          # Additional arguments for the sonarcloud scanner
          args:
            -Dsonar.organization=dmosquerad
            -Dsonar.projectKey=dmosquerad_Hexagonal-BE
            -Dsonar.sources=${{ env.SONAR_SOURCES }}
            -Dsonar.tests=${{ env.SONAR_TESTS }}
            -Dsonar.java.source=25
            -Dsonar.java.target=25
            -Dsonar.java.binaries=${{ env.SONAR_JAVA_BINARIES }}
            -Dsonar.java.test.binaries=${{ env.SONAR_JAVA_TEST_BINARIES }}
            -Dsonar.coverage.exclusions=**/src/test*/**
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ env.SONAR_COVERAGE_REPORTS }}
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath=${{ env.JAVA_HOME }}/bin/java
