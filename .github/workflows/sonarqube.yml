name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # This step should build, test and generate coverage reports
      # - name: Build and test
      #   run: <build + test + generate coverage reports>
      - name: Verificar inyección del Token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "❌ ERROR: El secreto 'SONAR_TOKEN' está VACÍO o no se encuentra en Repository Secrets."
            exit 1
          else
            echo "✅ El secreto 'SONAR_TOKEN' se ha detectado en GitHub Actions."
            echo "Longitud del token detectado: ${#TOKEN} caracteres."
          fi
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          args: >
            -Dsonar.organization=dmosquerad
            -Dsonar.projectKey=dmosquerad_j2_Hexagonal-BE
        with:
          args: >
            -Dsonar.organization=dmosquerad
            -Dsonar.projectKey=dmosquerad_j2_Hexagonal-BE